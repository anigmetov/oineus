name: Build and Upload Wheels

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Upload built wheels to PyPI"
        required: true
        default: false
        type: boolean

jobs:
  build_wheels:
    # One job per (Python version, platform/arch) so the wheels build on
    # separate runners in parallel instead of serially on a single macOS /
    # Linux runner. Wall-clock collapses from "sum of all wheels" to "one
    # wheel". Each job builds exactly one wheel via CIBW_BUILD + CIBW_ARCHS.
    name: ${{ matrix.python }} ${{ matrix.leg.os }} ${{ matrix.leg.archs }}
    runs-on: ${{ matrix.leg.os }}
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
        leg:
          - { os: ubuntu-latest, archs: x86_64 }
          - { os: macos-latest,  archs: arm64 }
          - { os: macos-latest,  archs: x86_64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Cache cibuildwheel downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cibuildwheel
            ~/Library/Caches/cibuildwheel
          key: cibw-${{ runner.os }}-${{ matrix.leg.archs }}-${{ hashFiles('pyproject.toml', '.github/workflows/build_wheels.yaml') }}
          restore-keys: |
            cibw-${{ runner.os }}-${{ matrix.leg.archs }}-
            cibw-${{ runner.os }}-

      - name: Set parallel build level
        # Ensure the per-wheel C++ compile uses every core. scikit-build-core normally
        # builds with Ninja (auto-parallel), so this is mainly insurance against a Unix
        # Makefiles fallback (serial without it); `cmake --build` honours
        # CMAKE_BUILD_PARALLEL_LEVEL either way. The vendored jemalloc build is
        # parallelised separately in CMakeLists.txt -- it runs at configure time via
        # execute_process, which CMAKE_BUILD_PARALLEL_LEVEL does not reach.
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Print selected wheel identifiers
        run: python -m cibuildwheel --print-build-identifiers
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS: "${{ matrix.leg.archs }}"
          CIBW_SKIP: "*musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"

      - name: Build wheels
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            python -m cibuildwheel --output-dir wheelhouse && break
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "cibuildwheel failed after ${n} attempts"
              exit 1
            fi
            sleep_seconds=$((30*n))
            echo "Retrying cibuildwheel in ${sleep_seconds}s (attempt $((n+1))/3)..."
            sleep "$sleep_seconds"
          done
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS: "${{ matrix.leg.archs }}"
          CIBW_SKIP: "*musllinux*"
          CIBW_BEFORE_ALL_LINUX: "dnf install -y boost-devel || yum install -y boost-devel"
          CIBW_BEFORE_ALL_MACOS: "brew install boost"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # Linux builds run inside the manylinux container; forward the parallel
          # level computed on the host (same core count) into it. On macOS the
          # build runs on the host and inherits the env var directly.
          CIBW_ENVIRONMENT_PASS_LINUX: "CMAKE_BUILD_PARALLEL_LEVEL"

      - name: List built wheels
        run: ls -l wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: built-wheels-${{ matrix.leg.os }}-${{ matrix.leg.archs }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  make_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload wheels and sdist to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_to_pypi }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: built-wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: dist
